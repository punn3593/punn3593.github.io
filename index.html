var KEY="sc_unlocked_pw";
var dec=new TextDecoder();
function u8(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
/* สร้างกุญแจจากรหัสผ่านที่ผู้ใช้กรอก */
async function k(pw){var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
return crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(D.s),iterations:250000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);}
/* ถอดรหัสแล้วเขียนหน้าเว็บจริงทับหน้านี้ */
async function open_(pw,remember){
  var key=await k(pw);
  var plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(D.i)},key,u8(D.c));
  if(remember)sessionStorage.setItem(KEY,pw);
  document.open();document.write(dec.decode(plain));document.close();
}
var p=document.getElementById("p"),b=document.getElementById("b"),e=document.getElementById("e"),box=document.getElementById("box");
async function go(){
  b.disabled=true;e.textContent="กำลังตรวจสอบ...";
  try{ await open_(p.value,true); }
  catch(err){ e.textContent="รหัสผ่านไม่ถูกต้อง"; box.classList.add("shake"); setTimeout(function(){box.classList.remove("shake");},400); p.value="";p.focus();b.disabled=false; }
}
b.addEventListener("click",go);
p.addEventListener("keydown",function(ev){if(ev.key==="Enter")go();});
/* เคยปลดล็อกในแท็บนี้แล้ว ไม่ต้องถามซ้ำ */
(function(){var s=sessionStorage.getItem(KEY);if(s){open_(s,false).catch(function(){sessionStorage.removeItem(KEY);p.focus();});}else{p.focus();}})();
</script>
