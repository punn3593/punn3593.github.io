<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ร็อคนี่หว่า</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#121214;color:#f2f2f4;font-family:'Noto Sans Thai',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.box{background:#1c1c20;border:1px solid #2e2e35;border-radius:28px;padding:38px 30px;width:100%;max-width:400px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.ico{width:64px;height:64px;margin:0 auto 18px;border-radius:22px;background:linear-gradient(140deg,#ff7aa8,#b3004b);display:flex;align-items:center;justify-content:center;font-size:28px}
h2{font-size:23px;font-weight:700;margin-bottom:6px}
p{color:#9a9aa5;font-size:14px;margin-bottom:22px}
input{width:100%;background:#12121a;border:1px solid #2e2e35;border-radius:16px;padding:15px;color:#f2f2f4;font:inherit;font-size:20px;text-align:center;letter-spacing:5px;outline:none}
input:focus{border-color:#ff7aa8}
button{width:100%;margin-top:14px;background:#ff7aa8;border:none;border-radius:16px;padding:15px;color:#1b1b1f;font:inherit;font-size:17px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#e{color:#ff7aa8;font-size:14px;margin-top:14px;min-height:20px}
@keyframes sh{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.shake{animation:sh .35s}
</style>
</head>
<body>
<div class="box" id="box">
  <div class="ico">&#128274;</div>
  <h2>ร็อคนี่หว่า</h2>
  <p>เนื้อหาถูกเข้ารหัสไว้ ใส่รหัสผ่านเพื่อเปิด</p>
  <input id="p" type="password" inputmode="numeric" placeholder="********" autocomplete="off">
  <button id="b" type="button">ปลดล็อก</button>
  <div id="e"></div>
</div>

var KEY="sc_unlocked_pw";
var dec=new TextDecoder();
function u8(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
/* สร้างกุญแจจากรหัสผ่านที่ผู้ใช้กรอก */
async function k(pw){var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
return crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(D.s),iterations:250000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);}
/* ถอดรหัสแล้วเขียนหน้าเว็บจริงทับหน้านี้ */
async function open_(pw,remember){
  var key=await k(pw);
  var plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(D.i)},key,u8(D.c));
  if(remember)sessionStorage.setItem(KEY,pw);
  document.open();document.write(dec.decode(plain));document.close();
}
var p=document.getElementById("p"),b=document.getElementById("b"),e=document.getElementById("e"),box=document.getElementById("box");
async function go(){
  b.disabled=true;e.textContent="กำลังตรวจสอบ...";
  try{ await open_(p.value,true); }
  catch(err){ e.textContent="รหัสผ่านไม่ถูกต้อง"; box.classList.add("shake"); setTimeout(function(){box.classList.remove("shake");},400); p.value="";p.focus();b.disabled=false; }
}
b.addEventListener("click",go);
p.addEventListener("keydown",function(ev){if(ev.key==="Enter")go();});
/* เคยปลดล็อกในแท็บนี้แล้ว ไม่ต้องถามซ้ำ */
(function(){var s=sessionStorage.getItem(KEY);if(s){open_(s,false).catch(function(){sessionStorage.removeItem(KEY);p.focus();});}else{p.focus();}})();
</script>
