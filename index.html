<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Portal | punn3593</title>
    
    <!-- Google Fonts: Prompt -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0d0d11;
            --card-bg: #181820;
            --card-hover-bg: #22222e;
            --text-primary: #ffffff;
            --text-secondary: #9a9ab0;
            --accent-pink: #ff2a85;
            --accent-pink-hover: #ff539e;
            --accent-glow: rgba(255, 42, 133, 0.25);
            --border-color: #2a2a38;
            --shadow-color: rgba(0, 0, 0, 0.4);
            --overlay-bg: rgba(13, 13, 17, 0.85);
        }

        [data-theme="light"] {
            --bg-color: #f4f4f7;
            --card-bg: #ffffff;
            --card-hover-bg: #fff0f6;
            --text-primary: #18181b;
            --text-secondary: #61616f;
            --accent-pink: #e60067;
            --accent-pink-hover: #ff2a85;
            --accent-glow: rgba(230, 0, 103, 0.15);
            --border-color: #e4e4e7;
            --shadow-color: rgba(0, 0, 0, 0.08);
            --overlay-bg: rgba(244, 244, 247, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 1rem;
            position: relative;
        }

        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--overlay-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 1rem;
        }

        .auth-card {
            background-color: var(--card-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 28px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 40px var(--shadow-color);
            position: relative;
        }

        .auth-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--accent-pink), #b3004b);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem auto;
            color: white;
            font-size: 1.8rem;
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        .auth-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .auth-subtitle {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: 1.8rem;
        }

        .input-group {
            position: relative;
            margin-bottom: 1.2rem;
        }

        .auth-input {
            width: 100%;
            padding: 14px 45px 14px 18px;
            border-radius: 16px;
            border: 1.5px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-size: 1.1rem;
            font-family: 'Prompt', sans-serif;
            outline: none;
            letter-spacing: 2px;
        }

        .auth-input:focus {
            border-color: var(--accent-pink);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .toggle-pwd {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.1rem;
        }

        .toggle-pwd:hover {
            color: var(--accent-pink);
        }

        .auth-btn {
            width: 100%;
            padding: 14px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, var(--accent-pink), #b3004b);
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            font-family: 'Prompt', sans-serif;
            cursor: pointer;
            box-shadow: 0 6px 18px var(--accent-glow);
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        .auth-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .error-msg {
            color: #ff4d4d;
            font-size: 0.88rem;
            margin-top: 0.8rem;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--accent-pink), #b3004b);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.25rem;
            box-shadow: 0 4px 14px var(--accent-glow);
        }

        .brand-title {
            font-size: 1.35rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .brand-title span {
            color: var(--accent-pink);
        }

        .header-controls {
            display: flex;
            gap: 10px;
        }

        .ctrl-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px 16px;
            border-radius: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            font-family: 'Prompt', sans-serif;
            font-weight: 500;
            box-shadow: 0 4px 10px var(--shadow-color);
        }

        .ctrl-btn:hover {
            border-color: var(--accent-pink);
            color: var(--accent-pink);
        }

        .clock-section {
            text-align: center;
            margin-bottom: 2.5rem;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 2rem 1.5rem;
            border-radius: 24px;
            box-shadow: 0 8px 24px var(--shadow-color);
            position: relative;
            overflow: hidden;
        }

        .clock-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-pink), transparent);
        }

        .time-display {
            font-size: 3.2rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 1px;
            font-variant-numeric: tabular-nums;
            line-height: 1.1;
        }

        .time-display .seconds {
            font-size: 1.8rem;
            color: var(--accent-pink);
        }

        .date-display {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-top: 8px;
            font-weight: 400;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1.5rem;
        }

        .menu-card {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background-color: var(--card-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 22px;
            padding: 1.8rem;
            text-decoration: none;
            color: var(--text-primary);
            min-height: 155px;
            box-shadow: 0 6px 16px var(--shadow-color);
            transition: transform 0.25s ease, background-color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .menu-card:hover {
            transform: translateY(-5px);
            background-color: var(--card-hover-bg);
            border-color: var(--accent-pink);
            box-shadow: 0 12px 28px var(--accent-glow);
        }

        .card-icon {
            font-size: 2.2rem;
            color: var(--accent-pink);
            margin-bottom: 1.2rem;
            transition: transform 0.25s ease;
        }

        .menu-card:hover .card-icon {
            transform: scale(1.1);
        }

        .card-footer {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-size: 1.4rem;
            font-weight: 600;
            line-height: 1.3;
        }

        .card-arrow {
            font-size: 1rem;
            color: var(--text-secondary);
            background: var(--bg-color);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
        }

        .menu-card:hover .card-arrow {
            color: #ffffff;
            background: var(--accent-pink);
            transform: translateX(4px);
        }

        footer {
            margin-top: 3.5rem;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        footer a {
            color: var(--accent-pink);
            text-decoration: none;
        }

        .shake {
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 600px) {
            .time-display { font-size: 2.4rem; }
            .time-display .seconds { font-size: 1.4rem; }
            .grid-container { grid-template-columns: 1fr; }
            .menu-card { padding: 1.4rem; min-height: 130px; }
            .card-title { font-size: 1.25rem; }
        }
    </style>
</head>
<body>

    <!-- Password Modal -->
    <div class="auth-overlay" id="authOverlay">
        <div class="auth-card" id="authCard">
            <div class="auth-icon">
                <i class="fa-solid fa-lock"></i>
            </div>
            <div class="auth-title">กรอกรหัสผ่าน</div>
            <div class="auth-subtitle">โปรดใส่รหัสผ่านเพื่อเข้าสู่ระบบส่วนตัว</div>
            <form onsubmit="verifyPassword(event)">
                <div class="input-group">
                    <input type="password" id="passwordInput" class="auth-input" placeholder="••••••••" autofocus required>
                    <i class="fa-solid fa-eye toggle-pwd" id="pwdToggleIcon" onclick="togglePasswordVisibility()"></i>
                </div>
                <button type="submit" class="auth-btn">เข้าสู่ระบบ <i class="fa-solid fa-arrow-right-to-bracket"></i></button>
                <div class="error-msg" id="errorMsg"><i class="fa-solid fa-circle-exclamation"></i> รหัสผ่านไม่ถูกต้อง โปรดลองอีกครั้ง</div>
            </form>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container">
        <header>
            <div class="brand">
                <div class="brand-icon">
                    <i class="fa-solid fa-layer-group"></i>
                </div>
                <div class="brand-title">Punn<span> Workspace</span></div>
            </div>
            
            <div class="header-controls">
                <button class="ctrl-btn" onclick="lockPage()" title="ล็อคหน้าเว็บ">
                    <i class="fa-solid fa-lock"></i>
                </button>
                <button class="ctrl-btn" id="themeToggleBtn" onclick="toggleTheme()">
                    <i class="fa-solid fa-moon" id="themeIcon"></i>
                    <span id="themeText">โหมดมืด</span>
                </button>
            </div>
        </header>

        <section class="clock-section">
            <div class="time-display" id="clockTime">00:00:<span class="seconds">00</span></div>
            <div class="date-display" id="clockDate">กำลังโหลดวันที่...</div>
        </section>

        <main class="grid-container">
            <a href="p1.html" class="menu-card">
                <div class="card-icon"><i class="fa-solid fa-folder-closed"></i></div>
                <div class="card-footer">
                    <div class="card-title">เอกสารส่วนตัว (P1)</div>
                    <div class="card-arrow"><i class="fa-solid fa-arrow-right"></i></div>
                </div>
            </a>

            <a href="p2.html" class="menu-card">
                <div class="card-icon"><i class="fa-solid fa-file-pen"></i></div>
                <div class="card-footer">
                    <div class="card-title">บันทึกส่วนตัว (P2)</div>
                    <div class="card-arrow"><i class="fa-solid fa-arrow-right"></i></div>
                </div>
            </a>

            <a href="p3.html" class="menu-card">
                <div class="card-icon"><i class="fa-solid fa-print"></i></div>
                <div class="card-footer">
                    <div class="card-title">เอกสารรอพิมพ์ (P3)</div>
                    <div class="card-arrow"><i class="fa-solid fa-arrow-right"></i></div>
                </div>
            </a>

            <a href="https://drive.google.com/drive/folders/1E7jSs3T0HKoKaaidBwoGSLQgEf3iQ_i3" target="_blank" rel="noopener noreferrer" class="menu-card">
                <div class="card-icon"><i class="fa-solid fa-calendar-days"></i></div>
                <div class="card-footer">
                    <div class="card-title">ตารางสอน</div>
                    <div class="card-arrow"><i class="fa-solid fa-arrow-right"></i></div>
                </div>
            </a>
        </main>

        <footer>
            <p>&copy; Personal Portal | <a href="https://punn3593.github.io" target="_blank">punn3593.github.io</a></p>
        </footer>
    </div>

    <script>
        const SECRET_KEY = "30032525";

        function verifyPassword(e) {
            e.preventDefault();
            const inputVal = document.getElementById('passwordInput').value;
            const errorMsg = document.getElementById('errorMsg');
            const authCard = document.getElementById('authCard');

            if (inputVal === SECRET_KEY) {
                sessionStorage.setItem('isAuth', 'true');
                document.getElementById('authOverlay').style.display = 'none';
                errorMsg.style.display = 'none';
            } else {
                errorMsg.style.display = 'block';
                authCard.classList.add('shake');
                setTimeout(() => authCard.classList.remove('shake'), 400);
            }
        }

        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('passwordInput');
            const pwdIcon = document.getElementById('pwdToggleIcon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                pwdIcon.className = 'fa-solid fa-eye-slash toggle-pwd';
            } else {
                pwdInput.type = 'password';
                pwdIcon.className = 'fa-solid fa-eye toggle-pwd';
            }
        }

        function lockPage() {
            sessionStorage.removeItem('isAuth');
            document.getElementById('passwordInput').value = '';
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('authOverlay').style.display = 'flex';
        }

        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('clockTime').innerHTML = `${hours}:${minutes}:<span class="seconds">${seconds}</span>`;

            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('clockDate').textContent = now.toLocaleDateString('th-TH', options);
        }

        setInterval(updateClock, 1000);
        updateClock();

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeUI(newTheme);
        }

        function updateThemeUI(theme) {
            const icon = document.getElementById('themeIcon');
            const text = document.getElementById('themeText');
            if (theme === 'light') {
                icon.className = 'fa-solid fa-sun';
                text.textContent = 'โหมดสว่าง';
            } else {
                icon.className = 'fa-solid fa-moon';
                text.textContent = 'โหมดมืด';
            }
        }

        (function init() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeUI(savedTheme);

            if (sessionStorage.getItem('isAuth') === 'true') {
                document.getElementById('authOverlay').style.display = 'none';
            } else {
                document.getElementById('authOverlay').style.display = 'flex';
            }
        })();
    </script>
</body>
</html>
